packages:
  - 'packages/ui'
  - 'packages/demo-nuxt'
  - 'packages/demo-vue'
  - 'packages/create-ui'

# Pin unhead v1 for Nuxt 3.10 compatibility (v2 breaks createServerHead)
overrides:
  unhead: 1.8.10
  '@unhead/vue': 1.8.10
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
publishBranch: main
dude: true
shamefullyHoist: true
shellEmulator: true
